name: Deploy private-credential backend
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: backend
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: backend-production
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: node --test backend/tests/*.test.js
      - run: npm ci --ignore-scripts
        working-directory: backend
      - run: npm audit --omit=dev
        working-directory: backend
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Deploy using short-lived federated credentials
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          REGION: ${{ vars.GCP_REGION }}
          RUNTIME_ACCOUNT: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}
          BUILD_ACCOUNT: ${{ vars.GCP_BUILD_SERVICE_ACCOUNT }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
        run: |
          test -n "$PROJECT_ID" && test -n "$REGION" && test -n "$RUNTIME_ACCOUNT" && test -n "$BUILD_ACCOUNT" && test -n "$GOOGLE_CLIENT_ID"
          gcloud run deploy todo-declare-api --source . --project "$PROJECT_ID" --region "$REGION" --service-account "$RUNTIME_ACCOUNT" --build-service-account "projects/$PROJECT_ID/serviceAccounts/$BUILD_ACCOUNT" --set-env-vars "GOOGLE_CLOUD_PROJECT=$PROJECT_ID,GOOGLE_CLIENT_ID=$GOOGLE_CLIENT_ID,ALLOWED_ORIGIN=https://kentuc322.github.io" --min-instances 0 --max-instances 2 --concurrency 20 --memory 256Mi --cpu 1 --timeout 30 --allow-unauthenticated --quiet
